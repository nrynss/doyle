[package]
name = "doyle-tms"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Truth maintenance for agent memory: flags the memories a change has made stale."
license = "Apache-2.0"
publish = false

[[bin]]
name = "doyle"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vimanam = { version = "=2.0.0", default-features = false }
