openapi: 3.0.3
info:
  title: Bellflower Market payments
  version: 2.0.0
paths:
  /payments:
    post:
      operationId: createPayment
      summary: Start a payment needing customer confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRequest" }
      responses:
        "200":
          description: The payment, awaiting confirmation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "402": { description: Card declined }
  /payments/{id}/confirm:
    post:
      operationId: confirmPayment
      summary: Confirm a payment after customer checks
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConfirmRequest" }
      responses:
        "200":
          description: The confirmed payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
  /payments/{id}:
    get:
      operationId: getPayment
      summary: Get one payment
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The payment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "404": { description: No payment with this id }
  /charges/{id}:
    get:
      operationId: getCharge
      summary: Get one charge
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "404": { description: No charge with this id }
  /refunds:
    post:
      operationId: createRefund
      summary: Return money for a charge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: The refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
components:
  schemas:
    PaymentRequest:
      type: object
      required: [amount, currency, card_token]
      properties:
        amount: { type: integer }
        currency: { type: string }
        card_token: { type: string }
    ConfirmRequest:
      type: object
      required: [return_url]
      properties: { return_url: { type: string, format: uri } }
    Payment:
      type: object
      required: [id, amount, currency, status, client_secret]
      properties:
        id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [requires_confirmation, succeeded] }
        client_secret: { type: string }
    Charge:
      type: object
      required: [id, amount, currency, status]
      properties:
        id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [succeeded] }
    RefundRequest:
      type: object
      required: [charge_id, amount]
      properties:
        charge_id: { type: string }
        amount: { type: integer }
    Refund:
      type: object
      required: [id, charge_id, amount]
      properties:
        id: { type: string }
        charge_id: { type: string }
        amount: { type: integer }
