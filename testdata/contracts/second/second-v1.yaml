openapi: 3.0.3
info:
  title: Bellflower Market payments
  version: 1.0.0
paths:
  /charges:
    post:
      operationId: createCharge
      summary: Capture a payment at once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChargeRequest" }
      responses:
        "200":
          description: The captured charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "402": { description: Card declined }
  /charges/{id}:
    get:
      operationId: getCharge
      summary: Get one charge
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The charge
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Charge" }
        "404": { description: No charge with this id }
  /refunds:
    post:
      operationId: createRefund
      summary: Return money for a charge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefundRequest" }
      responses:
        "200":
          description: The refund
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Refund" }
components:
  schemas:
    ChargeRequest:
      type: object
      required: [amount, currency, card_token]
      properties:
        amount: { type: integer }
        currency: { type: string }
        card_token: { type: string }
    Charge:
      type: object
      required: [id, amount, currency, status]
      properties:
        id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [succeeded] }
    RefundRequest:
      type: object
      required: [charge_id, amount]
      properties:
        charge_id: { type: string }
        amount: { type: integer }
    Refund:
      type: object
      required: [id, charge_id, amount]
      properties:
        id: { type: string }
        charge_id: { type: string }
        amount: { type: integer }
